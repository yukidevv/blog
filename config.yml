baseURL: https://yukidev.net/blog
defaultContentLanguage: ja
languageCode: ja
title: yukidev
theme: PaperMod
pluralizeListTitles: false
hasCJKLanguage: true

params:
  dateFormat: "2006/01/02"
  showReadingTime: true
  social: true
  ShowPostNavLinks: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  assets:
    favicon: "assets/favicon.ico"
    favicon16x16: "assets/favicon-16x16.png" 
    favicon32x32: "assets/favicon-32x32.png" 
    apple_touch_icon: "assets/apple-touch-icon.png"
  profileMode:
    enabled: true
    Title: yukidev.net
    subtitle: 稚拙なサイトに候
    buttons:
      - name: About
        url: "about/"
      - name: Posts
        url: "years/"
      - name: Gear
        url: "gear/"
  socialIcons:
    - name: x
      url: https://x.com/yukidevvv
    - name: github
      url: https://github.com/yukidevv
    - name: email
      url: mailto:nomad048@gmail.com
    - name: rss
      url: https://yukidev.net/blog/index.xml
  customCSS: ["/css/custom.css"]
  # PaperMod標準検索（Fuse.js）の精度調整。デフォルトは緩く無関係な記事まで拾うため厳しめに。
  fuseOpts:
    threshold: 0.2          # あいまい度（0=完全一致, デフォルト0.4）
    minMatchCharLength: 2   # 1文字ノイズを除外
    ignoreLocation: true
    keys:                   # 重み付け: タイトル重視・本文は弱め。permalinkは対象外
      - name: title
        weight: 0.7
      - name: summary
        weight: 0.2
      - name: content
        weight: 0.1
menu:
  main:
    - identifier: search
      name: Search
      url: "search/"
      weight: 10
taxonomies:
  category: "years"
# PaperMod標準検索（Fuse.js）用に検索インデックス index.json を出力する
outputs:
  home:
    - HTML
    - RSS
    - JSON
services:
  rss:
    limit: 10
